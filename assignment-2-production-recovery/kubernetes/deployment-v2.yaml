apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-deployment-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
      
  template:
    metadata:
      labels:
        app: account
        version: v2
    spec:
      containers:
      - name: account
        image: account-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000

